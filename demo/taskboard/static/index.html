<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Taskboard</h1>
    <form id="task-form" autocomplete="off">
      <label for="task-title">New task</label>
      <div class="row">
        <input id="task-title" name="title" type="text" required maxlength="200" placeholder="What needs doing?">
        <button type="submit">Add</button>
      </div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="task-list" aria-label="Tasks"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add your first one above.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
